name: CI Pipeline (multi-jobs)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (incl. flake8)
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r requirements.txt

      - name: Lint flake8 (critical errors)
        run: |
          flake8 app --count --select=E9,F7,F82,F841 --show-source --statistics

      - name: Lint flake8 (complexity & line length)
        run: |
          flake8 app --count --max-complexity=10 --max-line-length=127 --statistics

      - name: Lint flake8 tests
        run: |
          flake8 tests --count --max-line-length=127 --statistics

  tests:
    name: Tests (pytest + coverage)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (incl. pytest & coverage)
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v --cov=app