name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  ci:
    name: CI (lint + tests)
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (erreurs critiques app)
        run: |
          flake8 app --count --select=E9,F7,F82,F841 --show-source --statistics

      - name: Lint (complexité app)
        run: |
          flake8 app --count --max-complexity=10 --max-line-length=127 --statistics

      - name: Lint (tests)
        run: |
          flake8 tests --count --max-line-length=127 --statistics

      - name: Tests avec couverture
        run: |
          python -m pytest -v --cov=app